<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 440px;
    height: 280px;
    overflow: hidden;
    background: #1a56db;
    font-family: "Segoe UI", -apple-system, Arial, sans-serif;
  }
  .wrap {
    width: 440px;
    height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    text-align: center;
  }
  .bars {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 18px;
  }
  .bar {
    width: 10px;
    background: #ffffff;
    border-radius: 4px;
  }
  .title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .tagline {
    font-size: 15px;
    margin-top: 8px;
    color: #dbe6fb;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bars">
      <div class="bar" style="height:22px"></div>
      <div class="bar" style="height:38px"></div>
      <div class="bar" style="height:54px"></div>
      <div class="bar" style="height:38px"></div>
      <div class="bar" style="height:22px"></div>
    </div>
    <div class="title">Beacon AI</div>
    <div class="tagline">Voice-controlled accessibility for the web</div>
  </div>
</body>
</html>
